name: Build SanjuSystemX APK

"on":
push:
branches:
- main
- master
workflow_dispatch:

permissions:
contents: read

jobs:
build:
name: Build Android APK
runs-on: ubuntu-latest

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Set up JDK 17
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Set up Android SDK
    uses: android-actions/setup-android@v3

  - name: Set up Gradle
    uses: gradle/actions/setup-gradle@v4
    with:
      gradle-version: '8.9'

  - name: Check project files
    run: |
      echo "Checking Android project..."
      test -f settings.gradle.kts || { echo "ERROR: settings.gradle.kts missing"; exit 1; }
      test -f build.gradle.kts || { echo "ERROR: build.gradle.kts missing"; exit 1; }
      test -f app/build.gradle.kts || { echo "ERROR: app/build.gradle.kts missing"; exit 1; }
      test -f app/src/main/AndroidManifest.xml || { echo "ERROR: AndroidManifest.xml missing"; exit 1; }

  - name: Build debug APK
    run: gradle assembleDebug --no-daemon

  - name: Upload debug APK
    uses: actions/upload-artifact@v4
    with:
      name: SanjuSystemX-V3-debug-apk
      path: app/build/outputs/apk/debug/app-debug.apk
      if-no-files-found: error
